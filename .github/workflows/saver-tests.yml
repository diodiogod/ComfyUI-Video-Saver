name: Saver Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pillow piexif numpy requests

    - name: Test saver module
      run: |
        cd saver
        python -m pytest

    - name: Test resource metadata and output paths
      run: |
        cd tests
        python -m pytest

  video-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: tests/compat/package-lock.json
    - name: Install FFmpeg and compatibility test packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        npm ci --prefix tests/compat --ignore-scripts
    - name: Test native Civitai video metadata compatibility
      run: npm test --prefix tests/compat
